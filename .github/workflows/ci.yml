name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # Fails when NIP summaries/specs changed without re-running `bun run embed:nips`.
      - run: bun run embed:nips -- --check
      - run: bun run typecheck
      - run: bun run build
      # After build so apps/site/test/build.test.ts can inspect dist/.
      - run: bun run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: apps/site/dist
          retention-days: 3

  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/site/playwright-report
          retention-days: 7
